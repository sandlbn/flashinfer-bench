# Shapes from gqa_paged_decode_h32_kv8_d128_ps64, at a decode-sized batch.
inputs:
  q:            {shape: [B, HQ, D],        dtype: bfloat16}
  k_cache:      {shape: [P, PS, HKV, D],   dtype: bfloat16}
  v_cache:      {shape: [P, PS, HKV, D],   dtype: bfloat16}
  cu_seqlens_q: {shape: [Bp1],             dtype: int32}
  seqused_k:    {shape: [B],               dtype: int32}
  block_table:  {shape: [B, PPS],          dtype: int32}
inits:
  - dim: D
dims:
  B: 64        # sequences in the decode batch
  HQ: 32       # query heads
  HKV: 8       # kv heads
  D: 128       # head dim
  PS: 64       # page size
  PPS: 16      # pages per sequence (CONTEXT / PS)
  P: 1024      # total pages (B * PPS)
  Bp1: 65
