# Per op_type / per definition / per hardware eval config overrides.
# See BenchmarkConfig in flashinfer_bench/bench/config.py for the full schema.
#
# Merge order, lowest to highest:
#   defaults -> device recommendation -> op_type_config -> definition_config
#            -> hardware_config -> CLI flags
#
# The device recommendation comes from the backend itself (see Capabilities in
# flashinfer_bench/device/capabilities.py). Intel GPUs, for instance, ask for 200 warmup
# iterations rather than the generic 10, because discrete parts ramp clocks from idle.
# Anything set below overrides it.

op_type_config:
  # GEMM-shaped work needs far more warmup than the generic default before it settles.
  # Intel's own Triton benchmark suite uses n_warmup=800 for GEMM and 1000 for GEMM with a
  # fused epilogue (intel-xpu-backend-for-triton/benchmarks/triton_kernels_benchmark).
  # Their flash-attention benchmark notes the requirement is per-backend, not per-op:
  #   n_warmup_bwd = 400  # Maximum across sycl-tla=400, triton=10, onednn=10
  # A tiled GEMM has autotuning and JIT to settle; an elementwise kernel does not.
  gemm:
    warmup_runs: 800

  moe:
    required_matched_ratio: 0.95
  sampling:
    extra:
      sampling_validation_trials: 100
      sampling_tvd_threshold: 0.2

# Per-hardware overrides, keyed by canonical hardware id (Environment.hardware_id).
#
# Bringing up a new accelerator invites quietly loosening tolerances until things pass.
# Every such override belongs here, where it is one reviewable line in a diff, and every
# one needs a comment saying why the hardware genuinely differs -- not just that the test
# failed. The achieved error stays recorded in Correctness, so a relaxation that is
# masking a real bug remains visible.
#
# Example (commented out; add entries only with a justification):
#
# hardware_config:
#   INTEL_ARC_B580:
#     # Xe2 accumulates <reduction> in a different order than the CUDA reference, giving
#     # a larger but bounded error on <op>. Measured max_rel over N runs: <value>.
#     rtol: 0.02
hardware_config: {}
